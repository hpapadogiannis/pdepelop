name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 */12 * * *'   # Κάθε 12 ώρες (στις 00:00 και 12:00 UTC)
  workflow_dispatch:         # Σου επιτρέπει να το τρέξεις και χειροκίνητα

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Δίνει δικαίωμα να κάνει push στο repository

    steps:
      - uses: actions/checkout@v4

      - name: Create empty commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit --allow-empty -m "Keep alive: Prevent Streamlit sleep mode"
          git push
